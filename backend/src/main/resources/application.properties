spring.application.name=backend
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/careerpulse_mvp_dev
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Python FastAPI
ai.server.url=${AI_SERVER_URL:http://127.0.0.1:8000}

# Uploaded user documents
document.storage-dir=${DOCUMENT_STORAGE_DIR:uploads/documents}

# Scheduled nationwide job collection
job.collection.enabled=${JOB_COLLECTION_ENABLED:false}
job.collection.cron=${JOB_COLLECTION_CRON:-}
job.collection.retry-delay-ms=${JOB_COLLECTION_RETRY_DELAY_MS:0}

# Daily recommendation and bookmark deadline email
notification.mail.enabled=${MAIL_ENABLED:false}
notification.mail.cron=${MAIL_NOTIFICATION_CRON:0 0 9 * * *}
notification.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
